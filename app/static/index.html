<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED LawBase</title>
<style>
  :root { --navy:#1f3a5f; --ink:#1d2430; --muted:#5b6575; --line:#dde3ea; --bg:#f6f8fb; --card:#fff; --mark:#ffe9a8; --good:#1f7a4d; --bad:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 "Segoe UI", Calibri, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--navy); color:#fff; padding:10px 18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  header .snap { font-size:12px; opacity:.8; }
  .badge { font-size:11px; padding:1px 7px; border-radius:9px; background:#ffffff22; }
  .badge.internal { background:#b3261e; }
  nav { display:flex; gap:4px; margin-left:auto; }
  nav button { background:transparent; color:#fff; border:1px solid #ffffff55; padding:4px 12px; border-radius:4px; cursor:pointer; }
  nav button.on { background:#fff; color:var(--navy); }
  main { display:grid; grid-template-columns: minmax(340px, 44%) 1fr; gap:12px; padding:12px 18px; height:calc(100vh - 96px); }
  @media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } }
  .pane { background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:auto; padding:12px; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  input, select { font:inherit; padding:5px 7px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  input[type=search] { flex:1; min-width:200px; }
  button.go { background:var(--navy); color:#fff; border:0; padding:6px 14px; border-radius:4px; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  button.small { font-size:12px; padding:2px 8px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
  .hint { color:var(--muted); font-size:12px; }
  .res { border-bottom:1px solid var(--line); padding:8px 2px; cursor:pointer; }
  .res:hover { background:#f2f6fb; }
  .res:focus { outline:2px solid var(--navy); outline-offset:2px; background:#f2f6fb; }
  .res .t { font-weight:600; color:var(--navy); }
  .res .m { color:var(--muted); font-size:12px; }
  .snip { font-size:13px; margin:4px 0; }
  mark { background:var(--mark); padding:0 1px; }
  .chip { display:inline-block; font-size:11px; border:1px solid var(--line); border-radius:9px; padding:0 6px; margin:2px 3px 0 0; color:var(--muted); }
  .chip.cur { border-color:var(--navy); color:var(--navy); }
  .stance-pro { color:var(--good); font-weight:600; } .stance-adverse { color:var(--bad); font-weight:600; }
  .reader h2 { margin:0 0 4px; font-size:17px; color:var(--navy); }
  .reader .txt p { margin:0 0 8px; white-space:pre-wrap; }
  .headnote { background:#eef4fb; border-left:3px solid var(--navy); padding:8px 10px; margin:8px 0; }
  .basket { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:6px 18px; display:flex; gap:10px; align-items:center; }
  footer { font-size:11px; color:var(--muted); padding:0 18px 44px; }
  table { border-collapse:collapse; margin:6px 0; } td, th { border:1px solid var(--line); padding:3px 6px; vertical-align:top; } th { background:#eef2f7; }
</style>
</head>
<body>
<header>
  <h1>ED LawBase</h1>
  <span class="snap" id="snap"></span>
  <span class="badge internal" id="intBadge" hidden>INTERNAL PACK LOADED</span>
  <nav>
    <button data-tab="judgments" class="on">Judgments</button>
    <button data-tab="statutes">Statutes</button>
    <button data-tab="briefs">Briefs</button>
  </nav>
  <span id="hostedLinks" style="display:none; margin-left:8px;">
    <a href="/admin" id="adminLink" style="color:#fff; opacity:.85; font-size:12px; margin-right:12px; display:none;">Admin</a>
    <a href="#" id="signOut" style="color:#fff; opacity:.85; font-size:12px;">Sign out</a>
  </span>
</header>

<main>
  <section class="pane" id="left"></section>
  <section class="pane reader" id="right"><p class="hint">Search on the left. Plain words must all appear; use "quotes" for a phrase, OR for alternatives, e.g. <code>"tender of pardon" "special court"</code>.</p></section>
</main>

<div class="basket"><strong id="bCount">0</strong> case(s) in export list
  <button class="small" id="bExport">Export citation table (DOCX)</button>
  <button class="small" id="bClear">Clear</button>
  <span class="hint" id="bMsg"></span>
</div>
<footer id="attr"></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const snip = s => esc(s).replace(//g, "<mark>").replace(//g, "</mark>");
const api = async (path, params={}) => { const r = await fetch(path + "?" + new URLSearchParams(params)); return r.json(); };
let META = null, basket = JSON.parse(localStorageGet("lb-basket") || "[]");

function localStorageGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function localStorageSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function saveBasket(){ localStorageSet("lb-basket", JSON.stringify(basket)); $("#bCount").textContent = basket.length; }

async function download(body){
  $("#bMsg").textContent = "preparing…";
  const r = await fetch("/api/export", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok){ $("#bMsg").textContent = "export failed: " + (await r.text()); return; }
  const name = (r.headers.get("Content-Disposition")||"").match(/filename="([^"]+)"/)?.[1] || "LawBase.docx";
  const url = URL.createObjectURL(await r.blob());
  const a = Object.assign(document.createElement("a"), {href:url, download:name}); a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000); $("#bMsg").textContent = "saved " + name;
}

function md(text){  // small markdown renderer for briefs and headnotes
  const lines = esc(text).split(/\n/); let out = [], i = 0;
  const inl = s => s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/`([^`]+)`/g,"<code>$1</code>");
  while (i < lines.length){
    const l = lines[i];
    if (/^\|/.test(l)){ const rows=[]; while(i<lines.length && /^\|/.test(lines[i])) rows.push(lines[i++].replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
      out.push("<table>" + rows.filter(r=>!r.every(c=>/^:?-{3,}:?$/.test(c))).map((r,j)=>"<tr>"+r.map(c=>j?`<td>${inl(c)}</td>`:`<th>${inl(c)}</th>`).join("")+"</tr>").join("") + "</table>"); continue; }
    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) out.push(`<h${m[1].length+1}>${inl(m[2])}</h${m[1].length+1}>`);
    else if (/^\s*[-*]\s+/.test(l)) out.push(`<li>${inl(l.replace(/^\s*[-*]\s+/,""))}</li>`);
    else if (l.trim() && l.trim() !== "---") out.push(`<p>${inl(l)}</p>`);
    i++;
  }
  return out.join("");
}

// ---------------------------------------------------------------- judgments
function judgmentsTab(){
  $("#left").innerHTML = `
    <div class="bar"><input type="search" id="q" placeholder='case name, citation, or words in judgment'><button class="go" id="go">Search</button><button class="small" id="resetSearch">Clear search</button>
      <label class="hint" title="Off: every word may appear anywhere in the judgment. On: all words must sit in the same passage."><input type="checkbox" id="same"> same passage only</label></div>
    <div class="bar">
      <select id="court"><option value="">All courts</option>${META.courts.map(c=>`<option value="${c.court_slug}">${esc(c.court||c.court_slug)} (${c.n})</option>`).join("")}</select>
      <select id="act"><option value="">Any Act</option><option>PMLA</option><option>FEMA</option><option>FEOA</option><option>FERA</option></select>
      <select id="issue"><option value="">Any issue</option>${META.issues.map(i=>`<option value="${i.issue}">${esc(i.label)} (${i.n})</option>`).join("")}</select>
      <input id="yf" type="number" placeholder="from yr" style="width:86px"><input id="yt" type="number" placeholder="to yr" style="width:86px">
    </div>
    <div id="results" class="hint">Search by case name, citation, or judgment text. Direct title and citation matches appear first. You can also pick an issue with no search words.</div>`;
  const run = async () => {
    const started = performance.now();
    $("#go").disabled = true;
    $("#results").innerHTML = "searching…";
    const p = {q:$("#q").value, court:$("#court").value, act:$("#act").value, issue:$("#issue").value, year_from:$("#yf").value, year_to:$("#yt").value,
               within: $("#same").checked ? "chunk" : "case"};
    try {
      const d = await api("/api/search", p);
      if (d.error){ $("#results").textContent = d.error; return; }
      const elapsed = ((performance.now() - started) / 1000).toFixed(1);
      $("#results").innerHTML = `<p class="hint">${d.total} case(s)${d.total>d.results.length?`, showing ${d.results.length}`:""} · ${elapsed}s</p>` + d.results.map(r => `
      <div class="res" data-id="${esc(r.case_id)}" role="button" tabindex="0" aria-label="Open case: ${esc(r.title)}">
        <div class="t">${esc(r.title)}</div>
        <div class="m">${esc(r.court)} · ${esc(r.decision_date)} ${r.citation?"· "+esc(r.citation):""} ${r.disposition?"· "+esc(r.disposition):""} ${r.hits?"· "+r.hits+" matching passage(s)":""}</div>
        ${r.curated.map(c=>`<div class="snip"><span class="stance-${esc(c.stance)}">${esc(c.stance||"")}</span> ${esc(c.summary||"")}</div>`).join("")}
        ${r.snips.map(s=>`<div class="snip">…${snip(s)}…</div>`).join("")}
        <div>${r.issues.map(i=>`<span class="chip ${i.source==="curated"?"cur":""}">${esc(i.label||i.issue)}</span>`).join("")}
          <button class="small add" data-id="${r.case_id}">＋ export list</button></div>
      </div>`).join("");
      document.querySelectorAll("#results .res").forEach(el => {
        el.onclick = e => { if (!e.target.classList.contains("add")) openCase(el.dataset.id); };
        el.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && !e.target.classList.contains("add")) { e.preventDefault(); openCase(el.dataset.id); } };
      });
      document.querySelectorAll("#results .add").forEach(b => b.onclick = () => { if (!basket.includes(b.dataset.id)) basket.push(b.dataset.id); saveBasket(); });
    } catch (e) {
      $("#results").textContent = "Search failed. Please try again.";
    } finally {
      $("#go").disabled = false;
    }
  };
  $("#go").onclick = run; $("#q").onkeydown = e => { if (e.key === "Enter") run(); };
  $("#resetSearch").onclick = () => { judgmentsTab(); $("#q").focus(); };
}

async function openCase(id){
  $("#right").innerHTML = "loading…";
  let d;
  try { d = await api("/api/case", {id}); }
  catch (e) { $("#right").textContent = "Could not load this judgment. Please try again."; return; }
  if (d.error || !d.case) { $("#right").textContent = d.error || "Judgment not found."; return; }
  const c = d.case;
  $("#right").innerHTML = `
    <h2>${esc(c.title)}</h2>
    <div class="hint">${esc(c.court)} · ${esc(c.decision_date)} · ${esc(c.citation||"")} · ${esc(c.disposition||"")} · ${esc(c.case_number||"")}<br>
      ${c.judges?"Coram: "+esc(c.judges)+" · ":""}Acts: ${esc(c.acts||"-")} · ${c.source_url?`<a href="${esc(c.source_url)}" target="_blank" rel="noopener">source</a>`:"no source link in corpus"}</div>
    <div class="bar" style="margin-top:6px"><button class="small" id="xCase">Export judgment (DOCX)</button><button class="small" id="xAdd">＋ export list</button></div>
    <div>${d.issues.map(i=>`<span class="chip ${i.source==="curated"?"cur":""}">${esc(i.label||i.issue)}${i.source==="auto"?" · "+i.hits:""}</span>`).join("")}</div>
    ${d.curated.map(h=>`<div class="headnote"><strong>Headnote</strong> (${esc(h.tier)}) <span class="stance-${esc(h.stance)}">${esc(h.stance||"")}</span> ${esc(h.status||"")}<br>${esc(h.summary||"")}${md(h.body||"")}</div>`).join("")}
    <div class="txt">${d.chunks.map(ch=>`<p>${esc(ch.text.replace(/\[(SECTION|TITLE)\]\s*#*\s*/g,""))}</p>`).join("")}</div>`;
  $("#xCase").onclick = () => download({kind:"case", id});
  $("#xAdd").onclick = () => { if (!basket.includes(id)) basket.push(id); saveBasket(); };
}

// ---------------------------------------------------------------- statutes
function statutesTab(){
  $("#left").innerHTML = `
    <div class="bar"><select id="sact"><option value="">All Acts</option>${META.acts.map(a=>`<option value="${a.act_id}">${esc(a.act_short)}</option>`).join("")}</select>
      <input type="search" id="sq" placeholder="e.g. burden of proof"><button class="go" id="sgo">Search</button></div>
    <p class="hint">Section labels come from the source and can be off by one; the full text is authoritative.</p>
    <div id="sres"></div>`;
  const run = async () => {
    const d = await api("/api/statutes", {q:$("#sq").value, act:$("#sact").value});
    $("#sres").innerHTML = d.results.map(r => `<div class="res" data-id="${r.rowid}"><div class="t">${esc(r.act_short)} — s.${esc(r.section_number)} ${esc(r.section_title||"")}</div><div class="snip">${snip(r.snip)}</div></div>`).join("") || "<p class='hint'>No match.</p>";
    document.querySelectorAll("#sres .res").forEach(el => el.onclick = async () => {
      const p = await api("/api/provision", {id: el.dataset.id});
      $("#right").innerHTML = `<h2>${esc(p.act_title)}</h2><div class="hint">${esc(p.chapter||"")} · labelled s.${esc(p.section_number)} · <a href="${esc(p.source_url)}" target="_blank" rel="noopener">India Code</a></div><div class="txt"><p>${esc(p.text)}</p></div>`;
    });
  };
  $("#sgo").onclick = run; $("#sq").onkeydown = e => { if (e.key === "Enter") run(); }; $("#sact").onchange = run;
}

// ---------------------------------------------------------------- briefs
async function briefsTab(){
  const d = await api("/api/briefs");
  const item = b => `<div class="res" data-slug="${b.slug}"><div class="t">${esc(b.title)}</div><div class="m">${esc(b.date||"")} · <span class="chip ${b.tier==="internal"?"cur":""}">${esc(b.tier)}</span> ${esc(b.issues||"")}</div></div>`;
  $("#left").innerHTML = `<h3>Research briefs</h3>${d.briefs.map(item).join("") || "<p class='hint'>None yet.</p>"}
    ${META.internal ? `<h3>Court-reply templates (internal)</h3>${d.templates.map(item).join("") || "<p class='hint'>None yet.</p>"}` : ""}`;
  document.querySelectorAll("#left .res").forEach(el => el.onclick = async () => {
    const b = await api("/api/brief", {slug: el.dataset.slug});
    $("#right").innerHTML = `<h2>${esc(b.title)}</h2><div class="bar"><button class="small" id="xBrief">Export (DOCX)</button></div>${md(b.body)}`;
    $("#xBrief").onclick = () => download({kind:"brief", slug: b.slug});
  });
}

// ---------------------------------------------------------------- boot
(async () => {
  const who = await api("/api/whoami").catch(() => ({}));
  if (who.hosted) {
    $("#hostedLinks").style.display = "inline";
    if (who.is_admin) $("#adminLink").style.display = "inline";
    $("#signOut").onclick = async (e) => { e.preventDefault(); await fetch("/api/logout", {method:"POST"}); location.href = "/login.html"; };
  }
  META = await api("/api/meta");
  const m = META.meta;
  $("#snap").textContent = `${Number(m.cases||0).toLocaleString()} cases · ${Number(m.provisions||0).toLocaleString()} provisions · snapshot ${m.snapshot||"?"} · built ${m.built||"?"}`;
  $("#intBadge").hidden = !META.internal;
  $("#attr").textContent = "Research lead only — cite from the certified copy / SCR / SCC and check later history. " + (m.attribution||"");
  saveBasket();
  const tabs = {judgments: judgmentsTab, statutes: statutesTab, briefs: briefsTab};
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b)); tabs[b.dataset.tab]();
  });
  $("#bExport").onclick = () => basket.length ? download({kind:"table", ids: basket}) : ($("#bMsg").textContent = "add cases first");
  $("#bClear").onclick = () => { basket = []; saveBasket(); };
  judgmentsTab();
})();
</script>
</body>
</html>
