<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>ED LawBase - offline</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f6f8fb;
         font:15px/1.5 "Segoe UI", Roboto, Arial, sans-serif; color:#1d2430; padding:16px; box-sizing:border-box; }
  .card { background:#fff; border:1px solid #dde3ea; border-radius:10px; padding:26px 24px; max-width:340px; text-align:center; }
  img { width:72px; height:72px; }
  h1 { font-size:18px; color:#1f3a5f; margin:12px 0 6px; }
  p { color:#5b6575; margin:0 0 16px; }
  button { background:#1f3a5f; color:#fff; border:0; padding:10px 18px; border-radius:6px; font:inherit; }
</style>
</head>
<body>
<div class="card">
  <img src="/icon-192.png" alt="">
  <h1>No connection</h1>
  <p>LawBase needs the internet to search judgments. Check your mobile data or Wi-Fi and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
