<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED LawBase — Sign in</title>
<style>
  :root { --navy:#1f3a5f; --ink:#1d2430; --muted:#5b6575; --line:#dde3ea; --bg:#f6f8fb; --bad:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);
         font:14px/1.5 "Segoe UI", Calibri, Arial, sans-serif; color:var(--ink); }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:28px 30px; width:320px; box-shadow:0 2px 10px #0001; }
  h1 { font-size:19px; margin:0 0 4px; color:var(--navy); }
  p.sub { color:var(--muted); margin:0 0 18px; font-size:12.5px; }
  label { display:block; font-size:12.5px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:4px; font:inherit; }
  button { width:100%; margin-top:18px; background:var(--navy); color:#fff; border:0; padding:9px; border-radius:4px; font:inherit; cursor:pointer; }
  .err { color:var(--bad); font-size:12.5px; margin-top:10px; min-height:1.4em; }
</style>
</head>
<body>
<form class="card" id="f">
  <h1>ED LawBase</h1>
  <p class="sub">PMLA · FEMA · FEOA case law and statutes</p>
  <label>Username</label><input name="username" autocomplete="username" autofocus required>
  <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username: fd.get("username"), password: fd.get("password")})});
  if (r.ok) { location.href = "/"; return; }
  const d = await r.json().catch(() => ({}));
  document.getElementById("err").textContent = d.error || "Sign-in failed.";
});
</script>
</body>
</html>
