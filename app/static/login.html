<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13294b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LawBase">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
<title>ED LawBase — Sign in</title>
<style>
  :root { --navy:#13294b; --navy2:#1f3a5f; --gold:#b8862b; --ink:#1b2230; --muted:#5d6676; --line:#e2e5ea; --card:#fff; --bad:#b3261e;
          --serif:Georgia, "Iowan Old Style", Cambria, "Times New Roman", serif;
          --sans:"Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6e9ef; --muted:#9aa4b3; --line:#2b3340; --card:#181d25; --bad:#ff8a80; --navy2:#3b6db0; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px 16px;
         font:14px/1.55 var(--sans); font-variant-numeric:lining-nums; color:var(--ink);
         background:radial-gradient(1200px 600px at 15% -10%, #2b5283 0%, transparent 60%),
                    linear-gradient(160deg, #0d1c36 0%, #13294b 55%, #0f2240 100%); }
  .wrap { width:100%; max-width:380px; }
  .brand { display:flex; align-items:center; gap:12px; color:#fff; margin:0 0 18px 4px; }
  .brand svg { width:44px; height:44px; flex:none; filter:drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
  .brand h1 { font:600 26px/1.1 var(--serif); margin:0; letter-spacing:.2px; }
  .brand p { margin:3px 0 0; font-size:12.5px; opacity:.75; }
  .card { background:var(--card); border-radius:16px; padding:28px 28px 22px; box-shadow:0 20px 50px rgba(0,0,0,.35);
          border-top:4px solid var(--gold); }
  .card h2 { font:600 17px/1.3 var(--sans); margin:0 0 2px; }
  p.sub { color:var(--muted); margin:0 0 14px; font-size:12.5px; }
  label { display:block; font-size:12.5px; font-weight:500; color:var(--muted); margin:14px 0 5px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font:inherit; font-size:15px;
          color:var(--ink); background:var(--card); transition:border-color .15s, box-shadow .15s; }
  input:focus { outline:none; border-color:#1f3a5f; box-shadow:0 0 0 3px rgba(31,58,95,.18); }
  button { width:100%; margin-top:20px; background:var(--navy2); color:#fff; border:0; padding:11px; border-radius:9px;
           font:600 14.5px/1.2 var(--sans); cursor:pointer; transition:filter .15s; }
  button:hover { filter:brightness(1.15); }
  button:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .err { color:var(--bad); font-size:12.5px; margin-top:10px; min-height:1.4em; }
  .foot { color:#ffffffa0; font-size:11.5px; text-align:center; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#b8862b"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7v18M11 25h10M8.5 11h15"/><path d="M8.5 11l-3.5 7h7zM23.5 11l-3.5 7h7z"/></g></svg>
    <div><h1>ED LawBase</h1><p>PMLA · FEMA · FEOA case law and statutes</p></div>
  </div>
  <form class="card" id="f">
    <h2>Sign in</h2>
    <p class="sub">For officers of the Directorate of Enforcement.</p>
    <label>Username</label><input name="username" autocomplete="username" autofocus required>
    <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <p class="foot">Forgot your password? Ask your LawBase administrator to reset it.</p>
</div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username: fd.get("username"), password: fd.get("password")})});
  if (r.ok) { location.href = "/"; return; }
  const d = await r.json().catch(() => ({}));
  document.getElementById("err").textContent = d.error || "Sign-in failed.";
});
</script>
</body>
</html>
